[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-to-instrument"
version = "0.1.5"
description = "Monophonic audio-to-MIDI research prototype"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "librosa>=0.10.2,<1",
    "soundfile>=0.12,<1",
    "mido>=1.3,<2",
]

[project.scripts]
audio-to-midi = "audio_to_instrument.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
